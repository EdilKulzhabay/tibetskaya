<!-- ===== 2. Разметка кнопок - на КАЖДУЮ кнопку скачивания на странице (хиро, CTA-блок, липкая панель -
     сколько бы их ни было) добавить атрибут data-track-event. Пример: ===== -->

<!-- было:
<button type="button" style="...">Скачать для Android</button>
-->

<!-- стало: -->
<button type="button" data-track-event="download_android" style="...">Скачать для Android</button>
<button type="button" data-track-event="download_ios" style="...">Скачать для iOS</button>

<!-- Повторить data-track-event="download_android" / "download_ios" на всех остальных парах
     таких кнопок на странице (в hero, в CTA-секции, в липкой панели у варианта B и т.д.) -->


<!-- ===== 3. Обработчик событий - вставить перед </body>, один раз на страницу ===== -->
<script>
  var EVENT_MAP = {
    download_android: 'DownloadClickAndroid',
    download_ios: 'DownloadClickIOS'
  };

  function generateEventId() {
    return 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
  }

  function getCookie(name) {
    var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
  }

  // fbc иногда не успевает записаться в куки на первом клике сразу после перехода
  // по рекламе. Фолбэк - собираем его вручную из fbclid в адресной строке.
  function getFbc() {
    var fbcCookie = getCookie('_fbc');
    if (fbcCookie) return fbcCookie;

    var params = new URLSearchParams(window.location.search);
    var fbclid = params.get('fbclid');
    if (fbclid) {
      return 'fb.1.' + Date.now() + '.' + fbclid;
    }
    return null;
  }

  function trackDownloadClick(trackKey) {
    var eventName = EVENT_MAP[trackKey];
    if (!eventName) return;

    var eventId = generateEventId();

    // Клиентский пиксель
    fbq('trackCustom', eventName, {}, { eventID: eventId });

    // Зеркалим на бэкенд, чтобы тот отправил то же самое через КАПИ
    fetch('/api/track-download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        eventName: eventName,
        eventId: eventId,
        fbp: getCookie('_fbp'),
        fbc: getFbc(),
        sourceUrl: window.location.href
      })
    }).catch(function (err) {
      console.error('CAPI mirror failed', err);
    });
  }

  // Один обработчик на всю страницу - сработает на любую кнопку с data-track-event,
  // сколько бы их ни было и где бы они ни находились
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-track-event]');
    if (el) {
      trackDownloadClick(el.getAttribute('data-track-event'));
    }
  });
</script>
